name: PR Full Debug Build Comment

on:
  workflow_run:
    workflows: ["PR Full Debug Build"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    name: Comment PR with manual APK result
    # workflow_run executes from the default branch with write permissions.
    # Never check out or execute content from the source workflow.
    if: >-
      ${{ github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') }}
    runs-on: ubuntu-latest

    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const repoFullName = context.repo.owner + "/" + context.repo.repo;
            if (run.event !== "workflow_dispatch" ||
                run.head_repository?.full_name?.toLowerCase() !== repoFullName.toLowerCase() ||
                !["success", "failure"].includes(run.conclusion)) {
              core.info("Ignoring non-manual, cancelled or untrusted run.");
              return;
            }

            // Dispatch runs frequently have no linked PR. Locate the branch PR.
            const branchPulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              head: context.repo.owner + ":" + run.head_branch,
              per_page: 100
            });
            const pr = branchPulls.find((item) => item.head?.sha === run.head_sha);
            if (!pr) {
              core.info("No open PR at this manual build's commit.");
              return;
            }

            const latestPR = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            if (latestPR.data.state !== "open" || latestPR.data.head.sha !== run.head_sha) {
              core.info("PR advanced; do not advertise an obsolete debug APK.");
              return;
            }

            const marker = "<!-- nuvio-full-debug-build -->";
            const shortSha = run.head_sha.slice(0, 7);
            const runUrl = run.html_url;
            let body;

            if (run.conclusion === "success") {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100
              });
              const artifact = artifacts.find((item) =>
                !item.expired && ["NuvioTV-WireGuard-debug", "app-full-universal-debug.apk"].includes(item.name)
              );
              const artifactUrl = artifact
                ? context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo +
                    "/actions/runs/" + run.id + "/artifacts/" + artifact.id
                : null;
              body = [
                marker,
                "**Manual debug APK build:** " + (artifact ? "successful" : "artifact missing"),
                "",
                "Commit: " + shortSha,
                "",
                artifact ? "[Download debug APK](" + artifactUrl + ")" : "[Inspect build](" + runUrl + ")",
                "",
                "Built on request, not on every commit. APK artifact retention: 7 days."
              ].join("\n");
            } else {
              body = [
                marker,
                "**Manual debug APK build failed.**",
                "",
                "Commit: " + shortSha,
                "",
                "[Inspect failed build](" + runUrl + ")"
              ].join("\n");
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100
            });
            const existing = comments.find((item) =>
              item.user?.type === "Bot" && item.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body
              });
            }
